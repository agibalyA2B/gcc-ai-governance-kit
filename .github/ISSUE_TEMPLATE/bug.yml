name: Bug report
description: Something in the app does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: dropdown
    id: lang
    attributes: { label: Language, options: [English, Arabic] }
  - type: input
    id: browser
    attributes: { label: Browser and version }
